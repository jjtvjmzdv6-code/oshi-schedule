<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff0f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>ゆめかわ推し活カレンダー</title>
<style>
:root{--pink:#ffe4f0;--pink2:#fff0f7;--pink3:#f8c8df;--lav:#e8ddff;--ink:#76546a;--muted:#a9899b;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff7fb,#fff0f7 50%,#f5efff);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom))}
header{text-align:center;padding:22px 8px 12px}h1{font-size:23px;margin:4px 0;color:#bd7c9e}header p{margin:0;font-size:12px;color:#b18da1}
.panel{background:#ffffffd9;border:1px solid #f7d9e8;border-radius:23px;padding:15px;margin:12px 0;box-shadow:0 6px 20px #e9c7d833}
.top{display:flex;align-items:center;justify-content:space-between}.month{font-size:21px;font-weight:800;color:#b87598}.nav{border:0;border-radius:14px;background:#ffedf5;color:#bb7b9b;padding:8px 14px;font-size:18px}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.week{font-size:11px;color:#c39bb0;margin:14px 0 8px}.day{border:0;background:#fff8fb;border-radius:13px;min-height:48px;color:#89697b;padding:6px 0;font-size:13px}.day small{display:block;font-size:9px;color:#c47da2;min-height:11px}.day.today{outline:2px solid #e9aeca}.day.selected{background:#f5eaff;outline:2px solid #c7a8ec}.day.out{opacity:.35}
.filters{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #f0cfe0;background:#fff7fb;color:#a97892;border-radius:20px;padding:7px 11px;font-size:12px}.chip.on{background:#f2e8ff;border-color:#c9afea;color:#8663aa}
h2{font-size:16px;margin:2px 0 12px;color:#bd7c9e}.event{padding:11px 0;border-bottom:1px solid #f6e4ed}.event:last-child{border:0}.event strong{font-size:13px}.meta{font-size:11px;color:#b28da1;margin-top:4px}.tag{display:inline-block;border-radius:9px;padding:3px 7px;font-size:10px;margin-right:5px;background:#ffe9f2;color:#bd7c9e}.tag.skz{background:#e9e4ff;color:#8972bd}.tag.ateez{background:#ffe6e7;color:#bd777e}.tag.ive{background:#e7f2ff;color:#7295bd}.tag.bnd{background:#e8f5e8;color:#729c79}
button,a{cursor:pointer}a{color:#b87598}.notice{font-size:11px;color:#ad8b9e;line-height:1.6}.empty{text-align:center;padding:20px;color:#bd9caf;font-size:13px}
.refresh{background:#f6eaff;border:0;color:#9678b5;border-radius:14px;padding:9px 12px;font-size:12px}
</style></head><body>
<header><h1>♡ ゆめかわ推し活カレンダー ♡</h1><p>Stray Kids ・ ATEEZ ・ IVE ・ BOYNEXTDOOR</p></header>
<section class="panel">
<div class="top"><button class="nav" id="prev">‹</button><div class="month" id="month"></div><button class="nav" id="next">›</button></div>
<div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div class="days" id="days"></div>
</section>
<section class="panel"><h2>♡ グループで絞り込む</h2><div class="filters" id="filters"></div></section>
<section class="panel"><div class="top"><h2 id="listTitle">♡ 予定</h2><button class="refresh" id="refresh">最新情報を読み込む</button></div><div id="events"></div></section>
<section class="panel"><h2>♡ 自動更新について</h2><p class="notice" id="updated">公式サイトの予定を読み込みます。</p><p class="notice">予定はGitHub Actionsで毎日自動確認します。サイトの構成変更・会員限定情報・SNSのみの告知などは取得できない場合があります。予定の詳細は各公式ページで確認してください。</p></section>
<script>
const groups=[["Stray Kids","skz"],["ATEEZ","ateez"],["IVE","ive"],["BOYNEXTDOOR","bnd"]];
let y,m,selected=null,filter="all",items=[];
const $=id=>document.getElementById(id);
const today=new Date();y=today.getFullYear();m=today.getMonth();
function dateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function render(){
$("month").textContent=`${y}年 ${m+1}月`;
let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),html="";
for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let k=dateKey(d),count=items.filter(e=>e.date===k&&(filter==="all"||e.group===filter)).length;
html+=`<button class="day ${d.getMonth()!==m?"out":""} ${k===dateKey(today)?"today":""} ${selected===k?"selected":""}" data-date="${k}">${d.getDate()}<small>${count?"♥".repeat(Math.min(count,3)):""}</small></button>`}
$("days").innerHTML=html;
document.querySelectorAll(".day").forEach(b=>b.onclick=()=>{selected=b.dataset.date;render()});
$("filters").innerHTML=`<button class="chip ${filter==="all"?"on":""}" data-g="all">すべて</button>`+groups.map(g=>`<button class="chip ${filter===g[1]?"on":""}" data-g="${g[1]}">${g[0]}</button>`).join("");
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.g;render()});
let list=items.filter(e=>(filter==="all"||e.group===filter)&&(!selected||e.date===selected)).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
$("listTitle").textContent="♡ "+(selected?selected+"の予定":"予定一覧");
$("events").innerHTML=list.length?list.map(e=>`<div class="event"><strong><span class="tag ${e.group}">${groups.find(g=>g[1]===e.group)?.[0]||e.group}</span>${escapeHtml(e.title)}</strong><div class="meta">${e.date||"日付未確認"}　${e.category||"公式情報"}　·　<a href="${e.url}" target="_blank" rel="noopener">公式情報を見る ↗</a></div></div>`).join(""):`<div class="empty">この日の予定はまだありません ♡</div>`;
}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("prev").onclick=()=>{m--;if(m<0){m=11;y--}selected=null;render()};
$("next").onclick=()=>{m++;if(m>11){m=0;y++}selected=null;render()};
async function load(){try{let r=await fetch("schedules.json?"+Date.now());if(!r.ok)throw Error("not ready");let data=await r.json();items=data.events||[];$("updated").textContent="最終確認："+(data.updated_at||"更新情報なし")+" ／ 取得件数："+items.length+"件";render()}catch(e){$("updated").textContent="自動取得データはまだありません。GitHub Actionsの初回実行後に表示されます。";render()}}
$("refresh").onclick=load;load();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></body></html>
